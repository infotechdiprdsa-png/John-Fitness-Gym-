    window.firebaseAppInit = async function() {
      try {
        const appId = (typeof __app_id !== 'undefined' && __app_id) ? __app_id : 'john-fitness-owner-app-v6';
        let firebaseConfig = {
          apiKey: "AIzaSyDummyKeyForLocalDevFallback12345",

        };
        
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {

          } catch(e) {}
        }

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

    // --- HELPER: IMAGE COMPRESSION ---
    const compressImage = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 340;
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
            } else {
              if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.75));
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    };

    // --- HELPER: EXPIRY & DAYS CALCULATION ---
    const getMembershipTiming = (joinDate, durationMonths) => {
      if (!joinDate || !durationMonths) {
        return { expiryDate: new Date(), daysLeft: 30, isActive: true, isExpiringSoon: false };
      }
      const expiry = new Date(joinDate);
      expiry.setMonth(expiry.getMonth() + parseInt(durationMonths || 1));
      expiry.setHours(23, 59, 59, 999);

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const diffTime = expiry.getTime() - today.getTime();
      const daysLeft = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      const isActive = daysLeft >= 0;
      const isExpiringSoon = isActive && daysLeft <= 7;

      return { expiryDate: expiry, daysLeft, isActive, isExpiringSoon };
    };

    // --- HELPER: FINANCIAL CALCULATIONS ---
    const getMemberFinancials = (member) => {
      const totalAgreed = Number(member.totalFee ?? member.feeAmount ?? 0);
      let payments = Array.isArray(member.payments) ? member.payments : [];
      if (payments.length === 0 && member.feeStatus === 'Paid' && totalAgreed > 0) {
        payments = [{
          id: 'legacy-1',
          amount: totalAgreed,
          date: member.joinDate || new Date().toISOString().split('T')[0],
          mode: member.paymentMode || 'Cash',
          note: 'Full Fee Paid'
        }];
      }
      const paidAmount = payments.reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
      const pendingAmount = Math.max(0, totalAgreed - paidAmount);
      let status = 'Pending';
      if (pendingAmount === 0 && totalAgreed > 0) status = 'Paid';
      else if (paidAmount > 0 && pendingAmount > 0) status = 'Partial';
      return { totalAgreed, paidAmount, pendingAmount, status, payments };
    };

    function App() {
      const [members, setMembers] = useState(() => {
        try {
          const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
          return saved ? JSON.parse(saved) : [];
        } catch(e) { return []; }
      });

      const [deletedArchive, setDeletedArchive] = useState(() => {
        try {
          const saved = localStorage.getItem(LOCAL_ARCHIVE_KEY);
          return saved ? JSON.parse(saved) : [];
        } catch(e) { return []; }
      });

      const [isCloudSynced, setIsCloudSynced] = useState(false);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [toast, setToast] = useState(null);

      // Login States
      const [isLoggedIn, setIsLoggedIn] = useState(() => localStorage.getItem('jf_owner_logged') === 'true');
      const [loggedInPhone, setLoggedInPhone] = useState(() => localStorage.getItem('jf_owner_phone') || '');
      const [loginStep, setLoginStep] = useState('phone');
      const [phoneNumber, setPhoneNumber] = useState('');
      const [otpInput, setOtpInput] = useState('');
      const [loginError, setLoginError] = useState('');

      // Modals
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [editingMember, setEditingMember] = useState(null);
      const [selectedMemberForPayment, setSelectedMemberForPayment] = useState(null);
      const [receiptMember, setReceiptMember] = useState(null);
      const [activeIdCardMember, setActiveIdCardMember] = useState(null);
      const [previewPhoto, setPreviewPhoto] = useState(null);
      const [deleteTargetMember, setDeleteTargetMember] = useState(null);
      const [historyMemberModal, setHistoryMemberModal] = useState(null);

      // Search & Filters
      const [searchTerm, setSearchTerm] = useState('');
      const [statusFilter, setStatusFilter] = useState('All');
      const [paymentFilter, setPaymentFilter] = useState('All');
      const [archiveSearch, setArchiveSearch] = useState('');

      // --- HYBRID LOCAL & CLOUD SYNC ON MOUNT ---
      useEffect(() => {
        const initCloudSync = () => {
          if (window.FB && window.FB.db) {
            const { db, appId, collection, onSnapshot, query, doc, setDoc } = window.FB;
            
            // 1. Members Realtime Sync
            const membersRef = collection(db, 'artifacts', appId, 'public', 'data', 'members_list');
            onSnapshot(query(membersRef), (snapshot) => {
              const cloudMembers = [];
              snapshot.forEach(docSnap => {
                cloudMembers.push({ id: docSnap.id, ...docSnap.data() });
              });
              if (cloudMembers.length > 0) {
                setMembers(cloudMembers);
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(cloudMembers));
                setIsCloudSynced(true);
              } else if (members.length > 0) {
                members.forEach(m => {
                  setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_list', String(m.id)), m);
                });
              }
            }, (err) => {
              console.warn("Cloud sync offline mode active:", err);
            });

            // 2. Deleted Archive Realtime Sync
            const archiveRef = collection(db, 'artifacts', appId, 'public', 'data', 'deleted_archive');
            onSnapshot(query(archiveRef), (snapshot) => {
              const cloudArchive = [];
              snapshot.forEach(docSnap => {
                cloudArchive.push({ archiveId: docSnap.id, ...docSnap.data() });
              });
              if (cloudArchive.length > 0) {
                setDeletedArchive(cloudArchive);
                localStorage.setItem(LOCAL_ARCHIVE_KEY, JSON.stringify(cloudArchive));
              } else if (deletedArchive.length > 0) {
                deletedArchive.forEach(item => {
                  setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'deleted_archive', String(item.archiveId)), item);
                });
              }
            }, (err) => {
              console.warn("Archive sync offline mode active:", err);
            });
          }
        };

        if (window.FB && window.FB.db) {
          initCloudSync();
        } else {
          window.addEventListener('firebase-ready', initCloudSync);
          return () => window.removeEventListener('firebase-ready', initCloudSync);
        }
      }, []);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const saveMemberToCloudAndLocal = async (updatedMembersList, targetMember) => {
        setMembers(updatedMembersList);
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(updatedMembersList));

        if (window.FB && window.FB.db) {
          try {
            const { db, appId, doc, setDoc } = window.FB;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_list', String(targetMember.id)), targetMember);
            setIsCloudSynced(true);
          } catch (e) {
            console.error("Cloud save failed, local storage safe:", e);
          }
        }
      };

      const executeDeleteMember = async (archiveObj, originalId) => {
        const updated = members.filter(m => m.id !== originalId);
        setMembers(updated);
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(updated));

        const newArchive = [archiveObj, ...deletedArchive];
        setDeletedArchive(newArchive);
        localStorage.setItem(LOCAL_ARCHIVE_KEY, JSON.stringify(newArchive));

        if (window.FB && window.FB.db) {
          try {
            const { db, appId, doc, setDoc, deleteDoc } = window.FB;
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_list', String(originalId)));
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'deleted_archive', String(archiveObj.archiveId)), archiveObj);
          } catch (e) {
            console.error("Archive sync failed:", e);
          }
        }
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setLoginError('');
        const cleanPhone = phoneNumber.trim();
        if (loginStep === 'phone') {
          if (ALLOWED_NUMBERS.includes(cleanPhone)) {
            setLoginStep('otp');
          } else {
            setLoginError('यह मोबाइल नंबर अधिकृत (Authorized) नहीं है।');
          }
        } else {
          if (otpInput.trim() === DEMO_OTP) {
            setIsLoggedIn(true);
            setLoggedInPhone(cleanPhone);
            localStorage.setItem('jf_owner_logged', 'true');
            localStorage.setItem('jf_owner_phone', cleanPhone);
            showToast("John Fitness Admin में आपका स्वागत है!");
          } else {
            setLoginError('गलत OTP! कृपया सही फिक्स OTP दर्ज करें।');
          }
        }
      };

      const handleLogout = () => {
        setDeleteTargetMember({
          isLogoutConfirm: true,
          title: "लॉगआउट (Log out) करें?",
          message: "क्या आप एडमिन पैनल से लॉगआउट करना चाहते हैं? आपका सारा डेटा सुरक्षित रहेगा।"
        });
      };

      const handleExportBackup = () => {
        const fullBackupData = {
          members,
          deletedArchive,
          exportDate: new Date().toISOString()
        };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(fullBackupData, null, 2));
        const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", `john_fitness_backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(dlAnchor);
        dlAnchor.click();
        dlAnchor.remove();
        showToast("बैकअप फाइल सफलतापूर्वक डाउनलोड हो गई!");
      };

      const handleImportBackup = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            let importedMembers = [];
            if (Array.isArray(parsed)) {
              importedMembers = parsed;
            } else if (parsed && typeof parsed === 'object' && Array.isArray(parsed.members)) {
              importedMembers = parsed.members;
              if (Array.isArray(parsed.deletedArchive)) {
                setDeletedArchive(parsed.deletedArchive);
                localStorage.setItem(LOCAL_ARCHIVE_KEY, JSON.stringify(parsed.deletedArchive));
              }
            }
            setMembers(importedMembers);
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(importedMembers));

            if (window.FB && window.FB.db) {
              const { db, appId, doc, setDoc } = window.FB;
              for (let m of importedMembers) {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members_list', String(m.id)), m);
              }
            }
            showToast(`${importedMembers.length} मेंबर्स का डेटा रिस्टोर हो गया!`);
          } catch (err) {
            showToast("अमान्य बैकअप फाइल!", "error");
          }
        };
        reader.readAsText(file);
      };

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-[#050505] flex flex-col justify-between p-4 relative overflow-hidden">
            <div className="absolute -top-24 -left-24 w-96 h-96 bg-red-600/15 blur-[130px] rounded-full pointer-events-none"></div>
            <div className="absolute -bottom-24 -right-24 w-96 h-96 bg-red-800/15 blur-[130px] rounded-full pointer-events-none"></div>

            <div className="w-full max-w-5xl mx-auto z-10">
              <CustomLogoBanner />
            </div>

            <div className="flex-1 flex items-center justify-center my-6 z-10">
              <div className="bg-zinc-950/90 backdrop-blur-xl border border-zinc-800/90 p-6 sm:p-8 rounded-3xl w-full max-w-md shadow-[0_0_60px_rgba(220,38,38,0.12)]">
                <div className="w-14 h-14 bg-red-600/15 border border-red-500/30 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                  🔐
                </div>
                <h2 className="text-2xl font-black text-white text-center tracking-wide">OWNER ADMIN LOGIN</h2>
                <p className="text-zinc-400 text-center text-xs sm:text-sm mt-1 mb-6">
                  {loginStep === 'phone' ? '' : `मोबाइल ${phoneNumber} के लिए 6-अंकों का सुरक्षा पिन (OTP) डालें`}
                </p>

                <form onSubmit={handleLoginSubmit} className="space-y-4">
                  {loginStep === 'phone' ? (
                    <div>
                      <label className="text-xs font-bold uppercase tracking-wider text-zinc-400">मोबाइल नंबर (Owner Mobile)</label>
                      <input 
                        type="tel"
                        value={phoneNumber}
                        onChange={e => setPhoneNumber(e.target.value.replace(/\D/g, ''))}
                        placeholder="Enter 10-digit mobile number"
                        maxLength={10}
                        required
                        className="w-full mt-1.5 bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3.5 text-white font-bold text-base focus:outline-none focus:border-red-500 transition-colors"
                      />
                    </div>
                  ) : (
                    <div>
                      <label className="text-xs font-bold uppercase tracking-wider text-zinc-400">सुरक्षा OTP (Security PIN)</label>
                      <input 
                        type="password"
                        inputMode="numeric"
                        value={otpInput}
                        onChange={e => setOtpInput(e.target.value.replace(/\D/g, ''))}
                        placeholder="••••••"
                        maxLength={6}
                        required
                        autoFocus
                        className="w-full mt-1.5 bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3.5 text-white tracking-[0.5em] font-black text-center text-xl focus:outline-none focus:border-red-500 transition-colors"
                      />
                    </div>
                  )}

                  {loginError && (
                    <div className="bg-red-950/70 border border-red-800 text-red-300 px-4 py-2.5 rounded-xl text-xs font-bold text-center">
                      ⚠️ {loginError}
                    </div>
                  )}

                  <button 
                    type="submit" 
                    className="w-full bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-black py-3.5 rounded-xl shadow-[0_4px_20px_rgba(220,38,38,0.35)] transition-all active:scale-[0.98]"
                  >
                    {loginStep === 'phone' ? 'आगे बढ़ें (Continue) →' : 'अनलॉक करें (Verify & Login)'}
                  </button>

                  {loginStep === 'otp' && (
                    <button 
                      type="button" 
                      onClick={() => { setLoginStep('phone'); setOtpInput(''); setLoginError(''); }} 
                      className="w-full text-zinc-400 text-xs hover:text-white py-1 font-semibold"
                    >
                      ← मोबाइल नंबर बदलें
                    </button>
                  )}
                </form>
              </div>
            </div>
            <div className="text-center text-zinc-600 text-xs z-10">☁️ Cloud & Local Synced • John Fitness Official Management</div>
          </div>
        );
      }

      let totalRevenue = 0, totalPending = 0, cashTotal = 0, onlineTotal = 0;
      let activeCount = 0, expiringSoonCount = 0, expiredCount = 0;

      members.forEach(m => {
        const fin = getMemberFinancials(m);
        totalRevenue += fin.paidAmount;
        totalPending += fin.pendingAmount;
        fin.payments.forEach(p => {
          if (p.mode === 'Online') onlineTotal += (Number(p.amount) || 0);
          else cashTotal += (Number(p.amount) || 0);
        });

        const timing = getMembershipTiming(m.joinDate, m.planDuration);
        if (timing.isActive) {
          activeCount++;
          if (timing.isExpiringSoon) expiringSoonCount++;
        } else {
          expiredCount++;
        }
      });

      const filteredMembers = members.filter(m => {
        const matchesSearch = (m.name && m.name.toLowerCase().includes(searchTerm.toLowerCase())) ||
                              (m.phone && m.phone.includes(searchTerm));
        if (!matchesSearch) return false;

        const fin = getMemberFinancials(m);
        const timing = getMembershipTiming(m.joinDate, m.planDuration);

        if (activeTab === 'payments') {
          if (paymentFilter === 'Pending') return fin.pendingAmount > 0;
          if (paymentFilter === 'Paid') return fin.pendingAmount === 0 && fin.totalAgreed > 0;
          return true;
        }

        if (statusFilter === 'Active') return timing.isActive;
        if (statusFilter === 'Expiring') return timing.isExpiringSoon;
        if (statusFilter === 'Expired') return !timing.isActive;
        return true;
      });

      const filteredArchive = deletedArchive.filter(item => {
        if (!archiveSearch) return true;
        const q = archiveSearch.toLowerCase();
        return (item.name && item.name.toLowerCase().includes(q)) ||

              </div>

              <div className="flex items-center gap-2 w-full sm:w-auto">

                  <span>Data Secure</span>
                </div>
                <button

                >
                  <span className="text-base leading-none">+</span>
                  <span>नया एडमिशन (Add Member)</span>
                </button>
              </div>
            </div>
          </div>

          <main className="flex-1 p-3 sm:p-6 max-w-7xl w-full mx-auto space-y-5 pb-24">
            {activeTab === 'dashboard' && (
              <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
                <div 
                  onClick={() => { setActiveTab('members'); setStatusFilter('All'); }}
                  className="bg-gradient-to-br from-zinc-900/90 to-zinc-950 border border-zinc-800 hover:border-zinc-700 p-4 rounded-2xl shadow-lg cursor-pointer transition-all"
                >
                  <div className="flex justify-between items-start">
                    <p className="text-zinc-400 text-xs font-bold">कुल मेंबर्स (Total)</p>
                    <span className="text-lg">👥</span>
                  </div>
                  <p className="text-2xl sm:text-3xl font-black text-white mt-1.5">{members.length}</p>
                  <div className="flex flex-wrap gap-2 mt-2 text-[11px] font-bold">
                    <span className="text-green-400">● {activeCount} Active</span>
                    {expiredCount > 0 && <span className="text-red-400">● {expiredCount} Expired</span>}
                  </div>
                </div>

                <div className="bg-gradient-to-br from-green-950/30 to-zinc-950 border border-green-500/30 p-4 rounded-2xl shadow-lg">
                  <div className="flex justify-between items-start">
                    <p className="text-zinc-300 text-xs font-bold">कुल प्राप्त फीस (Received)</p>
                    <span className="text-lg">💰</span>
                  </div>
                  <p className="text-2xl sm:text-3xl font-black text-green-400 mt-1.5">₹{totalRevenue.toLocaleString()}</p>
                  <p className="text-[11px] text-zinc-400 font-semibold mt-2">नकद + ऑनलाइन कुल जमा</p>
                </div>

                <div 
                  onClick={() => { setActiveTab('payments'); setPaymentFilter('Pending'); }} 
                  className="bg-gradient-to-br from-orange-950/30 to-zinc-950 border border-orange-500/30 hover:border-orange-500/60 p-4 rounded-2xl shadow-lg cursor-pointer transition-all"
                >
                  <div className="flex justify-between items-start">
                    <p className="text-zinc-300 text-xs font-bold">कुल बकाया (Pending Due)</p>
                    <span className="text-lg">⏳</span>
                  </div>
                  <p className="text-2xl sm:text-3xl font-black text-orange-400 mt-1.5">₹{totalPending.toLocaleString()}</p>
                  <p className="text-[11px] text-orange-300 font-bold mt-2 underline">बकाया लिस्ट देखें →</p>
                </div>

                <div className="bg-gradient-to-br from-zinc-900/90 to-zinc-950 border border-zinc-800 p-4 rounded-2xl shadow-lg">
                  <div className="flex justify-between items-start">
                    <p className="text-zinc-400 text-xs font-bold">पेमेंट मोड (Cash / UPI)</p>
                    <span className="text-lg">🏦</span>
                  </div>
                  <div className="mt-2 space-y-1">
                    <p className="text-xs sm:text-sm font-extrabold text-emerald-400">💵 Cash: ₹{cashTotal.toLocaleString()}</p>
                    <p className="text-xs sm:text-sm font-extrabold text-blue-400">📱 UPI: ₹{onlineTotal.toLocaleString()}</p>
                  </div>
                </div>
              </div>
            )}

            {(expiringSoonCount > 0 || expiredCount > 0) && activeTab !== 'payments' && activeTab !== 'archive' && (
              <div className="bg-gradient-to-r from-zinc-900 via-zinc-950 to-zinc-900 border border-zinc-800 rounded-2xl p-3.5 flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-2.5 text-xs sm:text-sm">
                  <span className="text-xl">🔔</span>
                  <div>
                    <span className="font-bold text-white">मेंबरशिप वैधता अपडेट: </span>
                    {expiringSoonCount > 0 && <span className="text-amber-400 font-bold mr-2">{expiringSoonCount} मेंबर का प्लान 7 दिन में खत्म होगा।</span>}
                    {expiredCount > 0 && <span className="text-red-400 font-bold">{expiredCount} मेंबर का प्लान समाप्त (Expired) हो चुका है।</span>}
                  </div>
                </div>
                <div className="flex gap-2">
                  {expiringSoonCount > 0 && (
                    <button onClick={() => setStatusFilter('Expiring')} className="bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3 py-1.5 rounded-xl text-xs font-bold">
                      Expiring ({expiringSoonCount})
                    </button>
                  )}
                  {expiredCount > 0 && (
                    <button onClick={() => setStatusFilter('Expired')} className="bg-red-500/20 text-red-300 border border-red-500/30 px-3 py-1.5 rounded-xl text-xs font-bold">
                      Expired ({expiredCount})
                    </button>
                  )}
                </div>
              </div>
            )}

            {activeTab !== 'archive' && (
              <div className="bg-zinc-950 border border-zinc-800/90 p-3.5 rounded-2xl flex flex-col sm:flex-row gap-3 justify-between items-center shadow-md">
                <div className="relative w-full sm:w-96">
                  <input 
                    type="text"
                    placeholder="🔍 नाम या मोबाइल नंबर से मेंबर खोजें..."
                    value={searchTerm}
                    onChange={e => setSearchTerm(e.target.value)}
                    className="w-full bg-zinc-900 border border-zinc-800 rounded-xl pl-4 pr-9 py-2.5 text-sm text-white focus:outline-none focus:border-red-500"
                  />
                  {searchTerm && (
                    <button onClick={() => setSearchTerm('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white text-xs">✕</button>
                  )}
                </div>

                {activeTab === 'payments' ? (
                  <div className="flex gap-1.5 w-full sm:w-auto">
                    {[
                      { id: 'All', label: 'सभी (All)' },
                      { id: 'Pending', label: 'बाकी फीस (Due)' },
                      { id: 'Paid', label: 'पूरी जमा (Paid)' }
                    ].map(f => (
                      <button
                        key={f.id}
                        onClick={() => setPaymentFilter(f.id)}
                        className={`flex-1 sm:flex-initial px-3 py-2 rounded-xl text-xs font-bold transition-all ${
                          paymentFilter === f.id ? 'bg-red-600 text-white shadow' : 'bg-zinc-900 text-zinc-400 hover:text-white'
                        }`}
                      >
                        {f.label}
                      </button>
                    ))}
                  </div>
                ) : (
                  <div className="flex gap-1.5 w-full sm:w-auto overflow-x-auto">
                    {[
                      { id: 'All', label: 'सभी' },
                      { id: 'Active', label: 'Active' },
                      { id: 'Expiring', label: 'जल्द खत्म (7d)' },
                      { id: 'Expired', label: 'Expired' }
                    ].map(f => (
                      <button
                        key={f.id}
                        onClick={() => setStatusFilter(f.id)}
                        className={`flex-1 sm:flex-initial px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${
                          statusFilter === f.id ? 'bg-red-600 text-white shadow' : 'bg-zinc-900 text-zinc-400 hover:text-white'
                        }`}
                      >
                        {f.label}
                      </button>
                    ))}
                  </div>
                )}
              </div>
            )}

            {activeTab === 'archive' && (
              <div className="space-y-4">
                <div className="bg-zinc-950 border border-zinc-800 p-4 rounded-2xl flex flex-col sm:flex-row justify-between items-center gap-3">
                  <div>
                    <h3 className="text-base font-black text-white">🗂️ परमानेंट डिलीटेड मेंबर्स हिस्ट्री (Permanent Archive)</h3>
                    <p className="text-xs text-zinc-400">जिम से हटाए गए सभी मेंबर्स और उनके हटाने का कारण सुरक्षित रिकॉर्ड के रूप में यहां दर्ज है।</p>
                  </div>
                  <div className="w-full sm:w-72">
                    <input 
                      type="text"
                      placeholder="🔍 नाम, मोबाइल या कारण से खोजें..."
                      value={archiveSearch}
                      onChange={e => setArchiveSearch(e.target.value)}
                      className="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-red-500"
                    />
                  </div>
                </div>

                {filteredArchive.length === 0 ? (
                  <div className="bg-zinc-950 border border-zinc-800 rounded-3xl p-12 text-center space-y-3">
                    <div className="text-4xl">📂</div>
                    <p className="text-zinc-300 font-bold text-base">कोई डिलीटेड मेंबर रिकॉर्ड नहीं है</p>
                    <p className="text-zinc-500 text-xs">जब आप किसी मेंबर को हटाएंगे, तो उनका रिकॉर्ड यहाँ हमेशा के लिए सुरक्षित हो जाएगा।</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                    {filteredArchive.map((item, idx) => (
                      <div key={item.archiveId || idx} className="bg-zinc-950 border border-zinc-800/90 rounded-2xl p-4 space-y-2.5 shadow-xl">
                        <div className="flex items-start justify-between">
                          <div className="flex items-center gap-3">
                            {item.photo ? (
                              <img src={item.photo} alt={item.name} className="w-11 h-11 rounded-full object-cover border border-zinc-700" />
                            ) : (
                              <div className="w-11 h-11 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center font-black text-red-500 text-sm">
                                {item.name ? item.name.charAt(0) : 'M'}
                              </div>
                            )}
                            <div>
                              <h4 className="font-black text-white text-base">{item.name}</h4>
                              <p className="text-xs text-zinc-400">📞 {item.phone}</p>
                            </div>
                          </div>
                          <span className="bg-red-500/15 text-red-400 border border-red-500/30 text-[10px] font-black px-2.5 py-1 rounded-full">
                            Deleted
                          </span>
                        </div>

                        <div className="bg-zinc-900/80 border border-zinc-800/80 p-2.5 rounded-xl space-y-1.5 text-xs">
                          <div className="flex justify-between">
                            <span className="text-zinc-400">हटाने का कारण (Reason):</span>
                            <span className="font-bold text-amber-400">{item.deleteReason}</span>
                          </div>
                          {item.deleteNote && (
                            <div className="flex justify-between">
                              <span className="text-zinc-400">अतिरिक्त टिप्पणी:</span>
                              <span className="text-zinc-200">{item.deleteNote}</span>
                            </div>
                          )}
                          <div className="flex justify-between border-t border-zinc-800/80 pt-1">
                            <span className="text-zinc-500">हटाने की तारीख:</span>
                            <span className="font-semibold text-zinc-300">{item.deleteDate ? new Date(item.deleteDate).toLocaleDateString('en-IN') : 'N/A'}</span>
                          </div>
                          <div className="flex justify-between">
                            <span className="text-zinc-500">कुल तय / जमा फीस:</span>
                            <span className="font-bold text-zinc-200">₹{item.totalFee || 0} (जमा: ₹{item.paidAmount || 0})</span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {activeTab !== 'archive' && (
              <>
                {filteredMembers.length === 0 ? (
                  <div className="bg-zinc-950 border border-zinc-800/80 rounded-3xl p-12 text-center space-y-3">
                    <div className="text-4xl">🏋️‍♂️</div>
                    <p className="text-zinc-300 font-bold text-base">कोई मेंबर रिकॉर्ड नहीं मिला</p>
                    <p className="text-zinc-500 text-xs">नया मेंबर जोड़ने के लिए ऊपर "+ नया एडमिशन" बटन पर क्लिक करें।</p>
                  </div>
                ) : (
                  <>
                    <div className="grid grid-cols-1 md:hidden gap-3.5">

                        return (

                              <div className="flex items-center gap-3">

                                  member={member} 
                                  size="md"
                                  onClick={() => member.photo && setPreviewPhoto({ url: member.photo, name: member.name, phone: member.phone })}
                                />
                                <div>
                                  <h4 className="font-black text-white text-base leading-tight">{member.name}</h4>
                                  <p className="text-xs text-zinc-400 font-semibold mt-0.5">📞 {member.phone}</p>
                                  <div className="flex flex-wrap items-center gap-1.5 mt-1">

          <div className="fixed inset-0 z-[220] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">

        'बीच में ही छोड़ गया (Left Mid-way)',

          originalId: target.id,
          name: target.name,
          phone: target.phone,
          batch: target.batch,
          planDuration: target.planDuration,
          joinDate: target.joinDate,
          photo: target.photo || null,
          totalFee: fin.totalAgreed,
          paidAmount: fin.paidAmount,
          pendingAmount: fin.pendingAmount,
          deleteReason: selectedReason,
          deleteNote: customNote.trim(),
          deleteDate: deleteDate,
          createdAt: new Date().toISOString()
        };
        onConfirmDelete(archiveItem);

                  {reasonsList.map((res, idx) => (
                    <label 
                      key={idx} 
                      className={`flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all ${
                        selectedReason === res 
                          ? 'bg-red-600/15 border-red-500 text-white font-bold' 
                          : 'bg-zinc-900 border-zinc-800 text-zinc-300 hover:border-zinc-700'
                      }`}
                    >
                      <input 
                        type="radio" 
                        name="deleteReasonRadio" 
                        checked={selectedReason === res} 
                        onChange={() => setSelectedReason(res)} 
                        className="accent-red-600"
                      />
                      <span className="text-xs sm:text-sm">{res}</span>
                    </label>
                  ))}
                </div>
              </div>

              <div>
                <label className="text-xs font-bold text-zinc-300">हटाने की दिनांक (Delete Date):</label>
                <input 
                  type="date" 
                  required 
                  value={deleteDate} 
                  onChange={e => setDeleteDate(e.target.value)} 
                  className="w-full mt-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-white [color-scheme:dark] text-xs font-bold focus:outline-none focus:border-red-500" 
                />
              </div>

              <div>
                <label className="text-xs font-bold text-zinc-300">अतिरिक्त टिप्पणी (Optional Note):</label>

                  type="text" 
                  value={customNote} 
                  onChange={e => setCustomNote(e.target.value)} 
                  placeholder="जैसे: फीस बकाया थी या कोई अन्य विवरण..." 
                  className="w-full mt-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-red-500" 
                />
              </div>

              <div className="bg-zinc-900/60 border border-zinc-800 p-3 rounded-xl text-[11px] text-zinc-400">
                ℹ️ यह रिकॉर्ड परमानेंट डिलीटेड हिस्ट्री (Archive) में सुरक्षित हो जाएगा।

              <div className="flex justify-end gap-2.5 pt-2">
                <button type="button" onClick={onClose} className="px-4 py-2.5 rounded-xl bg-zinc-800 text-zinc-300 text-xs font-bold">रद्द करें</button>
                <button type="submit" className="px-5 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-black shadow-lg">
                  हटाएं और Archive में सेव करें
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function MemberFormModal({ mode = 'add', initialMember = null, onClose, onSave, showToast }) {
      const isEdit = mode === 'edit' && initialMember;
      const fin = isEdit ? getMemberFinancials(initialMember) : null;

      const [photoPreview, setPhotoPreview] = useState(isEdit ? (initialMember.photo || '') : '');
      const camRef = useRef(null);
      const galRef = useRef(null);

      const [formData, setFormData] = useState({
        name: isEdit ? (initialMember.name || '') : '',
        phone: isEdit ? (initialMember.phone || '') : '',
        batch: isEdit ? (initialMember.batch || 'Morning (सुबह)') : 'Morning (सुबह)',
        planDuration: isEdit ? String(initialMember.planDuration || '1') : '1',
        joinDate: isEdit ? (initialMember.joinDate || new Date().toISOString().split('T')[0]) : new Date().toISOString().split('T')[0],
        totalFee: isEdit ? String(fin.totalAgreed || '') : '',
        initialPaid: '',
        paymentMode: isEdit ? (initialMember.paymentMode || 'Cash') : 'Cash',
        notes: isEdit ? (initialMember.notes || '') : ''
      });

      const handlePhoto = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const base64 = await compressImage(file);
          setPhotoPreview(base64);
        } catch (err) {
          showToast("फोटो लोड करने में समस्या आई।", "error");
        }
      };

      const agreed = Number(formData.totalFee) || 0;
      const alreadyPaid = isEdit ? fin.paidAmount : (Number(formData.initialPaid) || 0);
      const pending = Math.max(0, agreed - alreadyPaid);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!isEdit && alreadyPaid > agreed) {
          showToast("जमा फीस कुल तय फीस से ज्यादा नहीं हो सकती!", "error");
          return;
        }

        if (isEdit) {
          const changes = [];
          if (initialMember.name !== formData.name.trim()) {
            changes.push({ field: 'नाम (Name)', oldValue: initialMember.name, newValue: formData.name.trim() });
          }
          if (initialMember.phone !== formData.phone.trim()) {
            changes.push({ field: 'मोबाइल (Phone)', oldValue: initialMember.phone, newValue: formData.phone.trim() });
          }
          if (initialMember.batch !== formData.batch) {
            changes.push({ field: 'बैच (Batch)', oldValue: initialMember.batch, newValue: formData.batch });
          }
          if (String(initialMember.planDuration) !== String(formData.planDuration)) {
            changes.push({ field: 'प्लान (Duration)', oldValue: `${initialMember.planDuration} Month`, newValue: `${formData.planDuration} Month` });
          }
          if (initialMember.joinDate !== formData.joinDate) {
            changes.push({ field: 'ज्वाइनिंग डेट', oldValue: initialMember.joinDate, newValue: formData.joinDate });
          }
          const oldFee = Number(initialMember.totalFee ?? initialMember.feeAmount ?? 0);
          if (oldFee !== agreed) {
            changes.push({ field: 'कुल तय फीस', oldValue: `₹${oldFee}`, newValue: `₹${agreed}` });
          }
          if ((initialMember.notes || '') !== formData.notes.trim()) {
            changes.push({ field: 'नोट्स', oldValue: initialMember.notes || 'कोई नहीं', newValue: formData.notes.trim() || 'कोई नहीं' });
          }

          const existingLogs = Array.isArray(initialMember.editLogs) ? initialMember.editLogs : [];
          const newEditLogs = changes.length > 0 ? [
            {
              timestamp: new Date().toISOString(),
              changes
            },
            ...existingLogs
          ] : existingLogs;

          const existingPayments = fin.payments;
          const updatedPending = Math.max(0, agreed - fin.paidAmount);

          onSave({
            ...initialMember,
            name: formData.name.trim(),
            phone: formData.phone.trim(),
            batch: formData.batch,
            planDuration: formData.planDuration,
            joinDate: formData.joinDate,
            photo: photoPreview || null,
            totalFee: agreed,
            feeAmount: agreed,
            paidAmount: fin.paidAmount,
            pendingAmount: updatedPending,
            feeStatus: updatedPending === 0 && agreed > 0 ? 'Paid' : 'Pending',
            notes: formData.notes.trim(),
            payments: existingPayments,
            editLogs: newEditLogs
          });
        } else {
          const paidNow = Number(formData.initialPaid) || 0;
          const payments = paidNow > 0 ? [{
            id: Date.now().toString(),
            amount: paidNow,
            date: formData.joinDate,
            mode: formData.paymentMode,
            note: 'एडमिशन के समय जमा'
          }] : [];

          onSave({
            id: 'jf_' + Date.now(),
            name: formData.name.trim(),
            phone: formData.phone.trim(),
            batch: formData.batch,
            planDuration: formData.planDuration,
            joinDate: formData.joinDate,
            photo: photoPreview || null,
            totalFee: agreed,
            feeAmount: agreed,
            paidAmount: paidNow,
            pendingAmount: Math.max(0, agreed - paidNow),
            feeStatus: Math.max(0, agreed - paidNow) === 0 && agreed > 0 ? 'Paid' : 'Pending',
            paymentMode: formData.paymentMode,
            notes: formData.notes.trim(),
            payments,
            editLogs: [],
            createdAt: new Date().toISOString()
          });
        }
      };

      return (
        <div className="fixed inset-0 z-[180] bg-black/85 backdrop-blur-sm flex items-center justify-center p-3 overflow-y-auto">
          <div className="bg-zinc-950 border border-zinc-800 rounded-3xl max-w-lg w-full p-5 space-y-4 my-auto max-h-[94vh] overflow-y-auto shadow-2xl">
            <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
              <div>
                <h3 className="text-xl font-black text-white">
                  {isEdit ? '✏️ मेंबर प्रोफाइल एडिट करें' : '🏋️ नया एडमिशन (New Member)'}
                </h3>
                <p className="text-xs text-zinc-400">
                  {isEdit ? 'बदलाव करने पर तारीख और एडिट हिस्ट्री सुरक्षित रहेगी' : 'कैंडिडेट की फोटो और प्लान की जानकारी भरें'}
                </p>
              </div>
              <button onClick={onClose} className="text-zinc-400 hover:text-white text-lg font-bold bg-zinc-900 w-8 h-8 rounded-full">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="bg-zinc-900/60 border border-zinc-800 p-3.5 rounded-2xl flex items-center gap-4">
                {photoPreview ? (
                  <div className="relative shrink-0">
                    <img src={photoPreview} className="w-20 h-20 rounded-2xl object-cover border-2 border-red-500" />
                    <button 
                      type="button" 
                      onClick={() => setPhotoPreview('')} 
                      className="absolute -top-2 -right-2 bg-red-600 text-white w-6 h-6 rounded-full text-xs font-bold shadow"
                    >
                      ✕
                    </button>
                  </div>
                ) : (
                  <div className="w-20 h-20 rounded-2xl bg-zinc-950 border border-dashed border-zinc-700 flex flex-col items-center justify-center text-xs text-zinc-500 shrink-0">
                    <span className="text-lg">📷</span>
                    <span className="text-[10px] font-bold">No Photo</span>
                  </div>
                )}
                <div className="space-y-2">
                  <p className="text-xs font-bold text-zinc-200">कैंडिडेट की फोटो {isEdit ? 'बदलें' : 'लगाएं'}</p>
                  <input ref={camRef} type="file" accept="image/*" capture="environment" onChange={handlePhoto} className="hidden" />
                  <input ref={galRef} type="file" accept="image/*" onChange={handlePhoto} className="hidden" />
                  <div className="flex flex-wrap gap-2">
                    <button type="button" onClick={() => camRef.current?.click()} className="bg-red-600/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-xl text-xs font-bold">📷 कैमरा</button>
                    <button type="button" onClick={() => galRef.current?.click()} className="bg-zinc-800 text-zinc-200 px-3 py-1.5 rounded-xl text-xs font-bold">🖼️ गैलरी</button>
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div className="sm:col-span-2">
                  <label className="text-xs font-bold text-zinc-400">पूरा नाम (Full Name) *</label>
                  <input 
                    type="text" 
                    required 
                    value={formData.name} 
                    onChange={e => setFormData({...formData, name: e.target.value})} 
                    className="w-full mt-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-white font-bold focus:outline-none focus:border-red-500" 
                    placeholder="जैसे: दिलखुश सैनी" 
                  />
                </div>

                <div>
                  <label className="text-xs font-bold text-zinc-400">मोबाइल नंबर (WhatsApp) *</label>
                  <input 
                    type="tel" 
                    required 
                    maxLength="10" 
                    value={formData.phone} 
                    onChange={e => setFormData({...formData, phone: e.target.value.replace(/\D/g, '')})} 
                    className="w-full mt-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-white font-bold focus:outline-none focus:border-red-500" 
                    placeholder="10 अंकों का नंबर" 
                  />
                </div>

                <div>
                  <label className="text-xs font-bold text-zinc-400">जिम टाइम / बैच (Batch)</label>
                  <select 
                    value={formData.batch} 
                    onChange={e => setFormData({...formData, batch: e.target.value})} 
                    className="w-full mt-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-white text-sm focus:outline-none focus:border-red-500"
                  >
                    <option value="Morning (सुबह)">🌅 Morning (सुबह)</option>
                    <option value="Evening (शाम)">🌆 Evening (शाम)</option>
                    <option value="Anytime (दोनों समय)">⚡ Anytime</option>
                  </select>
                </div>

                <div>
                  <label className="text-xs font-bold text-zinc-400">ज्वाइनिंग तारीख (Join Date) *</label>
                  <input 
                    type="date" 
                    required 
                    value={formData.joinDate} 
                    onChange={e => setFormData({...formData, joinDate: e.target.value})} 
                    className="w-full mt-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-white [color-scheme:dark] focus:outline-none focus:border-red-500" 
                  />
                </div>

                <div>
                  <label className="text-xs font-bold text-zinc-400">प्लान अवधि (Duration) *</label>
                  <select 
                    value={formData.planDuration} 
                    onChange={e => setFormData({...formData, planDuration: e.target.value})} 
                    className="w-full mt-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-red-500"
                  >
                    <option value="1">1 महीना (1 Month)</option>
                    <option value="2">2 महीने (2 Months)</option>
                    <option value="3">3 महीने (3 Months)</option>
                    <option value="6">6 महीने (6 Months)</option>
                    <option value="12">12 महीने (1 Year)</option>
                  </select>
                </div>

                <div className={isEdit ? "sm:col-span-2" : ""}>
                  <label className="text-xs font-bold text-zinc-400">कुल तय फीस (Total Agreed Fee ₹) *</label>
                  <input 
                    type="number" 
                    required 
                    min="0" 
                    value={formData.totalFee} 
                    onChange={e => setFormData({
                      ...formData, 
                      totalFee: e.target.value, 
                      initialPaid: (!isEdit && formData.initialPaid === formData.totalFee) ? e.target.value : formData.initialPaid
                    })} 
                    className="w-full mt-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-white font-black focus:outline-none focus:border-red-500" 
                    placeholder="जैसे: 2100" 
                  />
                </div>

                {!isEdit && (
                  <>
                    <div>
                      <label className="text-xs font-bold text-green-400">आज जमा राशि (Paid Now ₹)</label>
                      <input 
                        type="number" 
                        min="0" 
                        max={agreed} 
                        value={formData.initialPaid} 
                        onChange={e => setFormData({...formData, initialPaid: e.target.value})} 
                        className="w-full mt-1 bg-zinc-900 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-green-400 font-black focus:outline-none focus:border-green-500" 
                        placeholder="0" 
                      />
                    </div>
                    <div className="sm:col-span-2">
                      <label className="text-xs font-bold text-zinc-400">पेमेंट मोड (Payment Mode)</label>
                      <div className="grid grid-cols-2 gap-2.5 mt-1">
                        <button type="button" onClick={() => setFormData({...formData, paymentMode: 'Cash'})} className={`py-2.5 rounded-xl text-xs font-bold border ${formData.paymentMode === 'Cash' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-zinc-900 border-zinc-800 text-zinc-400'}`}>💵 नकद (Cash)</button>
                        <button type="button" onClick={() => setFormData({...formData, paymentMode: 'Online'})} className={`py-2.5 rounded-xl text-xs font-bold border ${formData.paymentMode === 'Online' ? 'bg-blue-500/20 border-blue-500 text-blue-300' : 'bg-zinc-900 border-zinc-800 text-zinc-400'}`}>📱 ऑनलाइन (UPI)</button>
                      </div>
                    </div>
                  </>
                )}

                <div className="sm:col-span-2">
                  <label className="text-xs font-bold text-zinc-400">नोट्स / पता (Optional Note)</label>
                  <input 
                    type="text" 
                    value={formData.notes} 
                    onChange={e => setFormData({...formData, notes: e.target.value})} 
                    className="w-full mt-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-red-500" 
                    placeholder="कोई विशेष जानकारी या पता..." 
                  />
                </div>
              </div>

              <div className="flex justify-between items-center bg-zinc-900 px-4 py-3 rounded-xl text-xs border border-zinc-800">
                <span className="text-zinc-400">बाकी बकाया (Balance Due):</span>
                <strong className="text-orange-400 text-sm">₹{pending.toLocaleString()}</strong>
              </div>

              <div className="flex justify-end gap-2.5 pt-2">
                <button type="button" onClick={onClose} className="px-4 py-2.5 rounded-xl bg-zinc-800 text-zinc-300 text-xs font-bold">रद्द करें</button>
                <button type="submit" className="px-6 py-2.5 rounded-xl bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white text-xs font-black shadow-lg">
                  {isEdit ? 'बदलाव सेव करें (Update)' : 'एडमिशन सेव करें (Save)'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function InstallmentModal({ member, onClose, onUpdateMember, onOpenReceipt, onEditProfile, showToast }) {
      const fin = getMemberFinancials(member);
      const [amount, setAmount] = useState(fin.pendingAmount > 0 ? String(fin.pendingAmount) : '');
      const [mode, setMode] = useState('Cash');
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [note, setNote] = useState('');

      const [editingPaymentId, setEditingPaymentId] = useState(null);
      const [editPayForm, setEditPayForm] = useState({ amount: '', date: '', mode: 'Cash', note: '' });

      const syncMemberPayments = (updatedPayments) => {
        const newPaid = updatedPayments.reduce((s, p) => s + (Number(p.amount) || 0), 0);
        const newPending = Math.max(0, fin.totalAgreed - newPaid);
        onUpdateMember({
          ...member,
          payments: updatedPayments,
          paidAmount: newPaid,
          pendingAmount: newPending,
          feeStatus: newPending === 0 && fin.totalAgreed > 0 ? 'Paid' : 'Pending'
        });
      };

      const handleAdd = (e) => {
        e.preventDefault();
        const val = Number(amount);
        if (!val || val <= 0) return;
        const newPay = { id: Date.now().toString(), amount: val, date, mode, note: note.trim() || 'किश्त जमा' };
        const updatedPayments = [...fin.payments, newPay];
        syncMemberPayments(updatedPayments);
        showToast(`₹${val} की किश्त जोड़ दी गई!`);
        setAmount('');
        setNote('');
      };

      const startEditPayment = (p) => {
        setEditingPaymentId(p.id);
        setEditPayForm({
          amount: String(p.amount),
          date: p.date,
          mode: p.mode || 'Cash',
          note: p.note || ''
        });
      };

      const saveEditedPayment = (id) => {
        const val = Number(editPayForm.amount);
        if (!val || val <= 0) return;
        const updated = fin.payments.map(p => p.id === id ? {
          ...p,
          amount: val,
          date: editPayForm.date,
          mode: editPayForm.mode,
          note: editPayForm.note
        } : p);
        syncMemberPayments(updated);
        setEditingPaymentId(null);
        showToast("किश्त अपडेट कर दी गई!");
      };

      const deletePayment = (id) => {
        const updated = fin.payments.filter(p => p.id !== id);
        syncMemberPayments(updated);
        showToast("किश्त हटा दी गई।");
      };

      return (
        <div className="fixed inset-0 z-[185] bg-black/85 backdrop-blur-sm flex items-center justify-center p-3 overflow-y-auto">
          <div className="bg-zinc-950 border border-zinc-800 rounded-3xl max-w-xl w-full p-5 space-y-4 my-auto max-h-[92vh] overflow-y-auto shadow-2xl">
            <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
              <div>
                <h3 className="text-xl font-black text-white">{member.name} - फीस खाता</h3>
                <p className="text-xs text-zinc-400">📞 {member.phone} • {member.planDuration}M Plan</p>
              </div>
              <div className="flex items-center gap-2">
                <button 
                  onClick={() => onEditProfile(member)} 
                  className="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-3 py-1.5 rounded-xl text-xs font-bold"
                >
                  ✏️ प्रोफाइल एडिट
                </button>
                <button onClick={onClose} className="text-zinc-400 hover:text-white text-lg font-bold bg-zinc-900 w-8 h-8 rounded-full">✕</button>
              </div>
            </div>

            <div className="grid grid-cols-3 gap-2.5 text-center">
              <div className="bg-zinc-900 p-3 rounded-2xl border border-zinc-800">
                <p className="text-[10px] text-zinc-400 uppercase font-bold">तय फीस</p>
                <p className="text-lg font-black text-white">₹{fin.totalAgreed.toLocaleString()}</p>
              </div>
              <div className="bg-green-950/30 p-3 rounded-2xl border border-green-800/40">
                <p className="text-[10px] text-green-400 uppercase font-bold">कुल जमा</p>
                <p className="text-lg font-black text-green-400">₹{fin.paidAmount.toLocaleString()}</p>
              </div>
              <div className="bg-orange-950/30 p-3 rounded-2xl border border-orange-800/40">
                <p className="text-[10px] text-orange-400 uppercase font-bold">बाकी (Due)</p>
                <p className="text-lg font-black text-orange-400">₹{fin.pendingAmount.toLocaleString()}</p>
              </div>
            </div>

            <div className="flex flex-wrap gap-2">
              <button type="button" onClick={() => onOpenReceipt(member)} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2.5 px-3 rounded-xl text-xs font-bold text-center shadow">
                🧾 पक्की रसीद / WhatsApp शेयर
              </button>
              {fin.pendingAmount > 0 && (
                <button type="button" onClick={() => sendWhatsAppDueAlert(member)} className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 px-3 rounded-xl text-xs font-bold text-center shadow">
                  📲 बकाया फीस WhatsApp रिमाइंडर
                </button>
              )}
            </div>

            <form onSubmit={handleAdd} className="bg-zinc-900/60 border border-zinc-800 p-4 rounded-2xl space-y-3">
              <p className="text-xs font-bold text-red-400 uppercase">+ नई किश्त जमा करें (Add Installment)</p>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                <input type="number" required min="1" value={amount} onChange={e => setAmount(e.target.value)} placeholder="₹ राशि" className="bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-white font-bold text-sm" />
                <input type="date" required value={date} onChange={e => setDate(e.target.value)} className="bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm [color-scheme:dark]" />
                <div className="grid grid-cols-2 gap-1">
                  <button type="button" onClick={() => setMode('Cash')} className={`rounded-xl text-xs font-bold border ${mode === 'Cash' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-zinc-950 border-zinc-800 text-zinc-400'}`}>💵 Cash</button>
                  <button type="button" onClick={() => setMode('Online')} className={`rounded-xl text-xs font-bold border ${mode === 'Online' ? 'bg-blue-500/20 border-blue-500 text-blue-300' : 'bg-zinc-950 border-zinc-800 text-zinc-400'}`}>📱 UPI</button>
                </div>
              </div>
              <div className="flex gap-2">
                <input type="text" value={note} onChange={e => setNote(e.target.value)} placeholder="नोट (जैसे: दूसरी किश्त)" className="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white" />
                <button type="submit" className="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-xl text-xs font-bold shadow">+ जमा करें</button>
              </div>
            </form>

            <div className="space-y-2">
              <p className="text-xs font-bold text-zinc-400 uppercase">जमा किश्तों की हिस्ट्री ({fin.payments.length}) — एडिट या डिलीट करें</p>
              {fin.payments.length === 0 ? (
                <p className="text-xs text-zinc-500 text-center py-4">अभी तक कोई किश्त दर्ज नहीं है।</p>
              ) : (
                fin.payments.map((p, i) => (
                  <div key={p.id || i} className="bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-xs">
                    {editingPaymentId === p.id ? (
                      <div className="space-y-2">
                        <div className="grid grid-cols-3 gap-2">
                          <input type="number" value={editPayForm.amount} onChange={e => setEditPayForm({...editPayForm, amount: e.target.value})} className="bg-zinc-950 border border-zinc-700 rounded-lg px-2 py-1.5 text-white font-bold" />
                          <input type="date" value={editPayForm.date} onChange={e => setEditPayForm({...editPayForm, date: e.target.value})} className="bg-zinc-950 border border-zinc-700 rounded-lg px-2 py-1.5 text-white [color-scheme:dark]" />
                          <select value={editPayForm.mode} onChange={e => setEditPayForm({...editPayForm, mode: e.target.value})} className="bg-zinc-950 border border-zinc-700 rounded-lg px-2 py-1.5 text-white">
                            <option value="Cash">Cash</option>
                            <option value="Online">Online/UPI</option>
                          </select>
                        </div>
                        <div className="flex gap-2">
                          <input type="text" value={editPayForm.note} onChange={e => setEditPayForm({...editPayForm, note: e.target.value})} className="flex-1 bg-zinc-950 border border-zinc-700 rounded-lg px-2 py-1 text-white" placeholder="नोट" />
                          <button type="button" onClick={() => saveEditedPayment(p.id)} className="bg-green-600 text-white px-3 py-1 rounded-lg font-bold">सेव</button>
                          <button type="button" onClick={() => setEditingPaymentId(null)} className="bg-zinc-800 text-zinc-300 px-3 py-1 rounded-lg">रद्द</button>
                        </div>
                      </div>
                    ) : (
                      <div className="flex justify-between items-center">
                        <div>
                          <span className="font-black text-green-400 text-sm">₹{Number(p.amount).toLocaleString()}</span>
                          <span className="ml-2 px-2 py-0.5 rounded bg-zinc-800 text-zinc-300 font-bold">{p.mode}</span>
                          <p className="text-zinc-400 mt-0.5">{new Date(p.date).toLocaleDateString('en-IN')} • {p.note}</p>
                        </div>
                        <div className="flex items-center gap-1.5">
                          <button onClick={() => startEditPayment(p)} className="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-2.5 py-1 rounded-lg font-bold">✏️ एडिट</button>
                          <button onClick={() => deletePayment(p.id)} className="bg-zinc-800 hover:bg-red-900/60 text-red-400 px-2 py-1 rounded-lg">🗑️</button>
                        </div>
                      </div>
                    )}
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- PROFESSIONALLY FORMATTED PORTRAIT RECEIPT MODAL ---
    function ReceiptModal({ member, onClose }) {
      const fin = getMemberFinancials(member);
      const { expiryDate } = getMembershipTiming(member.joinDate, member.planDuration);

      return (
        <div className="fixed inset-0 z-[195] bg-black/90 flex items-center justify-center p-3 overflow-y-auto">
          <div className="bg-zinc-950 border border-zinc-800 rounded-3xl max-w-md w-full p-5 space-y-4 my-auto">
            <div id="printable-receipt" className="bg-white text-zinc-900 p-6 rounded-2xl border-t-8 border-red-600 space-y-4 shadow-xl">
              <div className="flex items-center justify-between border-b-2 border-zinc-200 pb-3">
                <div>
                  <h2 className="text-2xl font-black tracking-tight text-red-600">JOHN FITNESS</h2>
                  <p className="text-[11px] font-bold text-zinc-500 uppercase">Official Fee Receipt</p>
                </div>
                <div className="text-right text-xs text-zinc-600 font-semibold">
                  <p>Date: {new Date().toLocaleDateString('en-IN')}</p>
                  <p>Receipt #: JF-{member.id.slice(-4).toUpperCase()}</p>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2 text-xs bg-zinc-100 p-3 rounded-xl">
                <div>
                  <p className="text-zinc-500">Member Name:</p>
                  <p className="font-bold text-sm">{member.name}</p>
                </div>
                <div>
                  <p className="text-zinc-500">Mobile Number:</p>
                  <p className="font-bold text-sm">{member.phone}</p>
                </div>
                <div>
                  <p className="text-zinc-500">Plan & Join Date:</p>
                  <p className="font-bold">{member.planDuration}M ({new Date(member.joinDate).toLocaleDateString('en-IN')})</p>
                </div>
                <div>
                  <p className="text-zinc-500">Valid Till:</p>
                  <p className="font-bold">{expiryDate.toLocaleDateString('en-IN')}</p>
                </div>
              </div>

              <div className="space-y-1.5 text-xs">
                <p className="font-bold text-zinc-700 uppercase">किश्त विवरण (Installments Paid):</p>
                {fin.payments.length === 0 ? (
                  <p className="text-zinc-400">कोई फीस जमा नहीं</p>
                ) : (
                  fin.payments.map((p, idx) => (
                    <div key={idx} className="flex justify-between border-b border-zinc-200 py-1">
                      <span>#{idx + 1} • {new Date(p.date).toLocaleDateString('en-IN')} ({p.mode})</span>
                      <strong className="text-green-700">₹{Number(p.amount).toLocaleString()}</strong>
                    </div>
                  ))
                )}
              </div>

              <div className="bg-zinc-900 text-white p-3.5 rounded-xl space-y-1 text-xs">
                <div className="flex justify-between">
                  <span>कुल तय फीस (Agreed Fee):</span>
                  <strong>₹{fin.totalAgreed.toLocaleString()}</strong>
                </div>
                <div className="flex justify-between text-green-400">
                  <span>कुल जमा राशि (Total Paid):</span>
                  <strong>₹{fin.paidAmount.toLocaleString()}</strong>
                </div>
                <div className="flex justify-between text-orange-400 border-t border-zinc-700 pt-1.5 text-sm font-black">
                  <span>बकाया राशि (Balance Due):</span>
                  <span>₹{fin.pendingAmount.toLocaleString()}</span>
                </div>
              </div>

              <p className="text-center text-[11px] font-bold text-zinc-500 pt-1">
                🙏 धन्यवाद! स्वस्थ रहें, फिट रहें • JOHN FITNESS
              </p>
            </div>

            <div className="flex flex-col sm:flex-row gap-2">
              <button
                onClick={() => sendWhatsAppReceipt(member)}
                className="flex-1 bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-xl text-xs shadow-lg"
              >
                📲 WhatsApp पर रसीद भेजें
              </button>
              <button
                onClick={() => window.print()}
                className="bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-3 px-4 rounded-xl text-xs"
              >
                🖨️ पोर्ट्रेट प्रिंट / PDF
              </button>
              <button
                onClick={onClose}
                className="bg-zinc-900 text-zinc-400 hover:text-white font-bold py-3 px-4 rounded-xl text-xs"
              >
                बंद करें
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- PROFESSIONALLY FORMATTED PORTRAIT ID CARD MODAL ---
    function IdCardModal({ member, onClose }) {
      const { expiryDate } = getMembershipTiming(member.joinDate, member.planDuration);
      const fin = getMemberFinancials(member);
      const cleanPhone = (member.phone || '').replace(/\D/g, '').slice(-10);

      const sendWhatsAppIdCard = () => {
        const msg = `*🪪 JOHN FITNESS - OFFICIAL MEMBERSHIP ID CARD 🪪*\n\n` +
          `नमस्ते *${member.name}* जी,\n` +
          `आपका John Fitness जिम का डिजिटल आईडी कार्ड विवरण नीचे दिया गया है:\n\n` +
          `👤 *नाम:* ${member.name}\n` +
          `📞 *मोबाइल:* ${member.phone}\n` +
          (member.batch ? `⏰ *शिफ्ट/बैच:* ${member.batch}\n` : '') +
          `📅 *एडमिशन तिथि:* ${new Date(member.joinDate).toLocaleDateString('en-IN')}\n` +
          `⏳ *वैधता समाप्ति (Valid Till):* ${expiryDate.toLocaleDateString('en-IN')}\n` +
          `📋 *प्लान:* ${member.planDuration} Month(s)\n` +
          `💳 *फीस स्टेटस:* ${fin.pendingAmount === 0 ? 'Fully Paid ✅' : `Balance Due ₹${fin.pendingAmount} ⚠️`}\n\n` +
          `💪 *स्वस्थ रहें, फिट रहें - JOHN FITNESS*`;

        window.open(`https://wa.me/91${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
      };

      return (
        <div className="fixed inset-0 z-[200] bg-black/90 flex items-center justify-center p-3 overflow-y-auto">
          <div className="bg-zinc-950 border border-zinc-800 rounded-3xl max-w-sm w-full p-5 space-y-4 my-auto">
            
            <div id="printable-id-card" className="bg-gradient-to-br from-zinc-900 via-zinc-950 to-zinc-900 text-white rounded-3xl border-2 border-red-600 p-6 shadow-2xl relative overflow-hidden space-y-4">
              <div className="absolute -right-10 -bottom-10 w-40 h-40 bg-red-600/10 rounded-full blur-2xl pointer-events-none"></div>

              <div className="flex items-center justify-between border-b border-zinc-800 pb-3">
                <div className="flex items-center gap-2">
                  <svg viewBox="0 0 155 110" className="w-10 h-8 shrink-0">
                    <rect x="4" y="34" width="12" height="42" rx="2" fill="#fff" />
                    <rect x="20" y="23" width="15" height="64" rx="2" fill="#fff" />
                    <rect x="35" y="47" width="88" height="16" fill="#fff" />
                    <path d="M 50 10 H 80 V 76 C 80 96 66 104 46 104 C 35 104 28 100 25 95 L 35 83 C 38 86 42 88 46 88 C 56 88 60 83 60 74 V 25 H 50 Z" fill="#DC2626" stroke="#fff" strokeWidth="2.5" />
                    <path d="M 88 10 H 146 V 26 H 108 V 47 H 136 V 63 H 108 V 102 H 88 Z" fill="#DC2626" stroke="#fff" strokeWidth="2.5" />
                  </svg>
                  <div>
                    <h3 className="font-black text-base tracking-tight leading-none text-red-500">JOHN FITNESS</h3>
                    <p className="text-[9px] font-bold text-zinc-400 tracking-wider">OFFICIAL ID CARD</p>
                  </div>
                </div>
                <span className="bg-red-600/20 text-red-400 border border-red-500/30 text-[9px] font-black px-2 py-0.5 rounded-full uppercase">
                  Active
                </span>
              </div>

              <div className="flex flex-col items-center text-center space-y-2 pt-1">
                {member.photo ? (
                  <img src={member.photo} alt={member.name} className="w-24 h-24 rounded-2xl object-cover border-2 border-red-500 shadow-lg" />
                ) : (
                  <div className="w-24 h-24 rounded-2xl bg-zinc-800 border border-zinc-700 flex items-center justify-center font-black text-red-500 text-3xl shadow-inner">
                    {member.name ? member.name.charAt(0) : 'M'}
                  </div>
                )}
                <div>
                  <h4 className="font-black text-xl text-white tracking-wide">{member.name}</h4>
                  <p className="text-xs text-zinc-400 font-bold mt-0.5">📞 {member.phone}</p>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2 bg-zinc-900/80 border border-zinc-800/80 p-3 rounded-2xl text-[11px]">
                <div>
                  <span className="text-zinc-500 block">एडमिशन तिथि:</span>
                  <span className="font-bold text-zinc-200">{new Date(member.joinDate).toLocaleDateString('en-IN')}</span>
                </div>
                <div>
                  <span className="text-zinc-500 block">वैधता समाप्ति:</span>
                  <span className="font-bold text-red-400">{expiryDate.toLocaleDateString('en-IN')}</span>
                </div>
                <div>
                  <span className="text-zinc-500 block">प्लान अवधि:</span>
                  <span className="font-bold text-zinc-200">{member.planDuration} Month(s)</span>
                </div>
                <div>
                  <span className="text-zinc-500 block">बैच / शिफ्ट:</span>
                  <span className="font-bold text-zinc-200">{member.batch || 'Morning'}</span>
                </div>
              </div>

              <div className="text-center border-t border-zinc-800/80 pt-2 text-[10px] text-zinc-500 font-semibold">
                ID: JF-{member.id.slice(-6).toUpperCase()} • Stay Fit, Stay Healthy
              </div>
            </div>

            <div className="flex flex-col gap-2 pt-1">
              <button
                onClick={sendWhatsAppIdCard}
                className="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-xl text-xs shadow-lg flex items-center justify-center gap-2"
              >
                <span>📲</span> <span>WhatsApp पर ID Card भेजें</span>
              </button>
              <button
                onClick={() => window.print()}
                className="w-full bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-2.5 rounded-xl text-xs"
              >
                🖨️ पोर्ट्रेट ID Card प्रिंट करें
              </button>
              <button
                onClick={onClose}
                className="w-full bg-zinc-900 text-zinc-400 hover:text-white font-bold py-2.5 rounded-xl text-xs"
              >
                बंद करें
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
