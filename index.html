<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JOHN FITNESS - Owner Admin App</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX compilation in browser/Acode -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Strict Anti-Copy & Selection Protection */
    * {
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;

      color: #ffffff;

      overflow-x: hidden;

    @media print {

      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; background: white !important; color: black !important; }
    }
  </style>

<body oncontextmenu="return false;" oncopy="return false;" oncut="return false;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- CONSTANTS ---
    const ALLOWED_NUMBERS = ['9461627473', '9660169104'];
    const DEMO_OTP = '159357';
    const STORAGE_KEY = 'john_fitness_members_v3';

    // --- HELPER: IMAGE COMPRESSION ---
    const compressImage = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 320;
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
            } else {
              if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.72));
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    };

    // --- HELPER: FINANCIAL CALCULATIONS ---
    const getMemberFinancials = (member) => {
      const totalAgreed = Number(member.totalFee ?? member.feeAmount ?? 0);
      let payments = Array.isArray(member.payments) ? member.payments : [];
      if (payments.length === 0 && member.feeStatus === 'Paid' && totalAgreed > 0) {
        payments = [{
          id: 'legacy-1',
          amount: totalAgreed,
          date: member.joinDate || new Date().toISOString().split('T')[0],
          mode: member.paymentMode || 'Cash',
          note: 'Full Fee Paid'
        }];
      }
      const paidAmount = payments.reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
      const pendingAmount = Math.max(0, totalAgreed - paidAmount);
      let status = 'Pending';
      if (pendingAmount === 0 && totalAgreed > 0) status = 'Paid';
      else if (paidAmount > 0 && pendingAmount > 0) status = 'Partial';
      return { totalAgreed, paidAmount, pendingAmount, status, payments };
    };

    // --- WHATSAPP HELPERS ---
    const sendWhatsAppReceipt = (member) => {
      const fin = getMemberFinancials(member);
      const expiry = new Date(member.joinDate);
      expiry.setMonth(expiry.getMonth() + parseInt(member.planDuration || 1));
      const lastPay = fin.payments[fin.payments.length - 1];
      const cleanPhone = (member.phone || '').replace(/\D/g, '').slice(-10);

      const msg = `*🏋️ JOHN FITNESS - OFFICIAL FEE RECEIPT 🏋️*\n` +
        `----------------------------------\n` +
        `👤 *नाम:* ${member.name}\n` +
        `📞 *मोबाइल:* ${member.phone}\n` +
        `📅 *ज्वाइनिंग:* ${new Date(member.joinDate).toLocaleDateString('en-IN')}\n` +
        `⏳ *प्लान:* ${member.planDuration} Month(s) (वैधता: ${expiry.toLocaleDateString('en-IN')})\n` +
        `----------------------------------\n` +
        `💰 *कुल तय फीस:* ₹${fin.totalAgreed.toLocaleString()}\n` +
        `✅ *कुल जमा फीस:* ₹${fin.paidAmount.toLocaleString()}\n` +
        (lastPay ? `🧾 *अंतिम जमा:* ₹${Number(lastPay.amount).toLocaleString()} (${lastPay.mode}) - ${new Date(lastPay.date).toLocaleDateString('en-IN')}\n` : '') +
        `⚠️ *बकाया राशि (Balance):* ₹${fin.pendingAmount.toLocaleString()}\n` +
        `----------------------------------\n` +
        `🙏 *धन्यवाद! स्वस्थ रहें, फिट रहें - JOHN FITNESS*`;

      window.open(`https://wa.me/91${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
    };

    const sendWhatsAppDueAlert = (member) => {
      const fin = getMemberFinancials(member);
      const cleanPhone = (member.phone || '').replace(/\D/g, '').slice(-10);

      const msg = `*🔔 JOHN FITNESS - बकाया फीस रिमाइंडर 🔔*\n\n` +
        `नमस्ते *${member.name}* जी,\n` +
        `आपकी जिम मेंबरशिप (${member.planDuration} Month Plan) का विवरण इस प्रकार है:\n\n` +
        `• *कुल तय फीस:* ₹${fin.totalAgreed.toLocaleString()}\n` +
        `• *अब तक जमा:* ₹${fin.paidAmount.toLocaleString()}\n` +
        `• *बकाया फीस (Pending Due):* *₹${fin.pendingAmount.toLocaleString()}*\n\n` +
        `कृपया अपनी बकाया फीस ₹${fin.pendingAmount.toLocaleString()} जल्द से जल्द जिम में नकद (Cash) या UPI के माध्यम से जमा कराने का कष्ट करें।\n\n` +
        `*धन्यवाद!* 🙏\n` +
        `*JOHN FITNESS*`;

      window.open(`https://wa.me/91${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
    };

    function CustomLogoBanner({ loggedInPhone, onLogout, onExport, onImport }) {
      const fileRef = useRef(null);
      return (
        <div className="w-full bg-gradient-to-b from-white via-zinc-50 to-zinc-200 border-b-4 border-red-600 px-3 py-2 sm:px-6 sm:py-3 shadow-md">
          <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
            <div className="flex items-center gap-3 sm:gap-5 select-none">
              <svg viewBox="0 0 155 110" className="w-16 h-12 sm:w-24 sm:h-16 shrink-0 drop-shadow-sm">
                <rect x="4" y="34" width="12" height="42" rx="2" fill="#18181B" />
                <rect x="20" y="23" width="15" height="64" rx="2" fill="#18181B" />
                <rect x="35" y="47" width="88" height="16" fill="#18181B" />
                <path d="M 50 10 H 80 V 76 C 80 96 66 104 46 104 C 35 104 28 100 25 95 L 35 83 C 38 86 42 88 46 88 C 56 88 60 83 60 74 V 25 H 50 Z" fill="#DC2626" stroke="#18181B" strokeWidth="2.5" />
                <path d="M 88 10 H 146 V 26 H 108 V 47 H 136 V 63 H 108 V 102 H 88 Z" fill="#DC2626" stroke="#18181B" strokeWidth="2.5" />
              </svg>
              <div className="flex flex-col justify-center">
                <span className="text-zinc-900 font-black text-2xl sm:text-4xl md:text-5xl tracking-tight leading-none" style={{ fontFamily: 'Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif' }}>
                  JOHN
                </span>
                <span className="text-zinc-900 font-extrabold text-sm sm:text-xl md:text-2xl tracking-[0.18em] leading-none mt-1">
                  FITNESS
                </span>
              </div>
            </div>

            {onLogout && (
              <div className="flex items-center gap-2">
                <input ref={fileRef} type="file" accept=".json" onChange={onImport} className="hidden" />
                <button onClick={onExport} className="bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-bold px-2.5 py-2 rounded-lg" title="डेटा बैकअप डाउनलोड करें">
                  ⬇️ Backup
                </button>
                <button onClick={() => fileRef.current?.click()} className="bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-bold px-2.5 py-2 rounded-lg" title="बैकअप फाइल अपलोड करें">
                  ⬆️ Restore
                </button>
                <button onClick={onLogout} className="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-3 py-2 rounded-lg shadow">
                  Logout ({loggedInPhone.slice(-4)})
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function MemberAvatar({ member, size = "md", onClick }) {
      const sizes = { sm: "w-10 h-10 text-sm", md: "w-12 h-12 text-base", lg: "w-16 h-16 text-xl" };
      if (member.photo) {
        return <img src={member.photo} alt={member.name} onClick={onClick} className={`${sizes[size]} rounded-full object-cover border-2 border-red-500 shadow cursor-pointer shrink-0 bg-zinc-800`} />;
      }
      return (
        <div onClick={onClick} className={`${sizes[size]} rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center font-black text-red-500 shrink-0`}>
          {member.name ? member.name.charAt(0).toUpperCase() : 'M'}
        </div>
      );
    }

    function App() {
      const [members, setMembers] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? JSON.parse(saved) : [];
        } catch (e) { return []; }
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [toast, setToast] = useState(null);

      // Login States
      const [isLoggedIn, setIsLoggedIn] = useState(() => localStorage.getItem('jf_owner_logged') === 'true');
      const [loggedInPhone, setLoggedInPhone] = useState(() => localStorage.getItem('jf_owner_phone') || '');
      const [loginStep, setLoginStep] = useState('phone');
      const [phoneNumber, setPhoneNumber] = useState('');
      const [otpInput, setOtpInput] = useState('');
      const [loginError, setLoginError] = useState('');

      // Modals
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [selectedMemberForPayment, setSelectedMemberForPayment] = useState(null);
      const [receiptMember, setReceiptMember] = useState(null);
      const [previewPhoto, setPreviewPhoto] = useState(null);
      const [confirmDialog, setConfirmDialog] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');
      const [paymentFilter, setPaymentFilter] = useState('All');

      // Save to LocalStorage whenever members change
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(members));
        } catch (e) {
          showToast("स्टोरेज फुल हो रहा है, कृपया पुरानी फोटो हटाएं या बैकअप लें।", "error");
        }
      }, [members]);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setLoginError('');
        const cleanPhone = phoneNumber.trim();
        if (loginStep === 'phone') {
          if (ALLOWED_NUMBERS.includes(cleanPhone)) {
            setLoginStep('otp');
          } else {
            setLoginError('यह मोबाइल नंबर अधिकृत (Authorized) नहीं है।');
          }
        } else {
          if (otpInput.trim() === DEMO_OTP) {
            setIsLoggedIn(true);
            setLoggedInPhone(cleanPhone);
            localStorage.setItem('jf_owner_logged', 'true');
            localStorage.setItem('jf_owner_phone', cleanPhone);
            showToast("John Fitness Admin में आपका स्वागत है!");
          } else {
            setLoginError('गलत OTP! कृपया सही डेमो OTP दर्ज करें।');
          }
        }
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setLoginStep('phone');
        setPhoneNumber('');
        setOtpInput('');
        localStorage.removeItem('jf_owner_logged');
      };

      const handleExportBackup = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(members, null, 2));
        const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", `john_fitness_backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(dlAnchor);
        dlAnchor.click();
        dlAnchor.remove();
        showToast("बैकअप फाइल डाउनलोड हो गई!");
      };

      const handleImportBackup = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const imported = JSON.parse(ev.target.result);
            if (Array.isArray(imported)) {
              setMembers(imported);
              showToast(`${imported.length} मेंबर्स का डेटा सफलतापूर्वक रिस्टोर हो गया!`);
            }
          } catch (err) {
            showToast("अमान्य बैकअप फाइल!", "error");
          }
        };
        reader.readAsText(file);
      };

      const isMemberActive = (joinDate, durationMonths) => {
        if (!joinDate || !durationMonths) return true;
        const expiry = new Date(joinDate);
        expiry.setMonth(expiry.getMonth() + parseInt(durationMonths));
        const today = new Date();
        today.setHours(0,0,0,0);
        expiry.setHours(0,0,0,0);
        return expiry >= today;
      };

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-[#070707] flex flex-col justify-between p-4">
            <div className="w-full max-w-5xl mx-auto">
              <CustomLogoBanner />
            </div>
            <div className="flex-1 flex items-center justify-center my-6">
              <div className="bg-zinc-950 border border-zinc-800 p-6 sm:p-8 rounded-3xl w-full max-w-md shadow-2xl">
                <h2 className="text-2xl font-black text-white text-center mb-1">OWNER LOGIN</h2>
                <p className="text-zinc-400 text-center text-sm mb-6">
                  {loginStep === 'phone' ? 'अपना रजिस्टर्ड ओनर मोबाइल नंबर डालें' : `मोबाइल ${phoneNumber} के लिए 6-अंकों का डेमो OTP डालें`}
                </p>
                <form onSubmit={handleLoginSubmit} className="space-y-4">
                  {loginStep === 'phone' ? (
                    <div>
                      <label className="text-xs font-bold uppercase text-zinc-400">मोबाइल नंबर (Mobile Number)</label>
                      <input 
                        type="tel"
                        value={phoneNumber}
                        onChange={e => setPhoneNumber(e.target.value.replace(/\D/g, ''))}
                        placeholder="9461627473 / 9660169104"
                        maxLength={10}
                        required
                        className="w-full mt-1 bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3.5 text-white font-bold focus:outline-none focus:border-red-500"
                      />
                    </div>
                  ) : (
                    <div>
                      <label className="text-xs font-bold uppercase text-zinc-400">डेमो OTP (Fixed Demo OTP)</label>
                      <input 
                        type="password"
                        inputMode="numeric"
                        value={otpInput}
                        onChange={e => setOtpInput(e.target.value.replace(/\D/g, ''))}
                        placeholder="••••••"
                        maxLength={6}
                        required
                        autoFocus
                        className="w-full mt-1 bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3.5 text-white tracking-[0.5em] font-black text-center text-xl focus:outline-none focus:border-red-500"
                      />
                    </div>
                  )}
                  {loginError && <div className="bg-red-950/60 border border-red-800 text-red-300 px-4 py-2.5 rounded-xl text-xs font-bold">{loginError}</div>}
                  <button type="submit" className="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3.5 rounded-xl shadow-lg">
                    {loginStep === 'phone' ? 'आगे बढ़ें (Next)' : 'लॉगिन करें (Verify & Login)'}
                  </button>
                  {loginStep === 'otp' && (
                    <button type="button" onClick={() => { setLoginStep('phone'); setOtpInput(''); setLoginError(''); }} className="w-full text-zinc-400 text-xs hover:text-white py-1">
                      ← मोबाइल नंबर बदलें
                    </button>
                  )}
                </form>
              </div>
            </div>
            <div className="text-center text-zinc-600 text-xs">🔒 Copy Protection Enabled • John Fitness Official App</div>
          </div>
        );
      }

      // Compute Dashboard Totals
      let totalRevenue = 0, totalPending = 0, cashTotal = 0, onlineTotal = 0;
      members.forEach(m => {
        const fin = getMemberFinancials(m);
        totalRevenue += fin.paidAmount;
        totalPending += fin.pendingAmount;
        fin.payments.forEach(p => {
          if (p.mode === 'Online') onlineTotal += (Number(p.amount) || 0);
          else cashTotal += (Number(p.amount) || 0);
        });
      });

      const filteredMembers = members.filter(m => 
        (m.name && m.name.toLowerCase().includes(searchTerm.toLowerCase())) ||
        (m.phone && m.phone.includes(searchTerm))
      );

      return (
        <div className="min-h-screen bg-[#070707] text-white flex flex-col">
          {toast && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[200] w-[90%] max-w-md bg-zinc-900 border border-zinc-700 text-white px-5 py-3.5 rounded-2xl shadow-2xl font-bold text-sm text-center">
              {toast.message}
            </div>
          )}

          <header className="sticky top-0 z-40">
            <CustomLogoBanner 
              loggedInPhone={loggedInPhone} 
              onLogout={handleLogout} 
              onExport={handleExportBackup}
              onImport={handleImportBackup}
            />
          </header>

          {/* Navigation Tabs */}
          <div className="bg-zinc-950 border-b border-zinc-800 px-4 py-2.5 flex flex-wrap items-center justify-between gap-2">
            <div className="flex gap-2 overflow-x-auto">
              {[
                { id: 'dashboard', label: '📊 डैशबोर्ड' },
                { id: 'members', label: '🏋️ सभी मेंबर्स' },
                { id: 'payments', label: '💰 फीस, रसीद और बकाया' }
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setActiveTab(t.id)}
                  className={`px-4 py-2 rounded-xl font-bold text-xs sm:text-sm whitespace-nowrap transition-all ${
                    activeTab === t.id ? 'bg-red-600 text-white shadow' : 'bg-zinc-900 text-zinc-400 hover:text-white'
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </div>

            <button 
              onClick={() => setIsAddModalOpen(true)}
              className="bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-bold shadow-lg"
            >
              + नया एडमिशन (Add Member)
            </button>
          </div>

          {/* Main Content */}
          <main className="flex-1 p-4 max-w-7xl w-full mx-auto space-y-6 pb-20">
            {activeTab === 'dashboard' && (
              <>
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
                  <div className="bg-zinc-950 border border-zinc-800 p-4 rounded-2xl">
                    <p className="text-zinc-400 text-xs font-bold">कुल मेंबर्स (Total)</p>
                    <p className="text-2xl sm:text-3xl font-black text-white mt-1">{members.length}</p>
                    <p className="text-xs text-green-400 font-bold mt-2">
                      {members.filter(m => isMemberActive(m.joinDate, m.planDuration)).length} Active
                    </p>
                  </div>
                  <div className="bg-zinc-950 border border-green-500/30 p-4 rounded-2xl">
                    <p className="text-zinc-400 text-xs font-bold">कुल प्राप्त फीस (Received)</p>
                    <p className="text-2xl sm:text-3xl font-black text-green-400 mt-1">₹{totalRevenue.toLocaleString()}</p>
                    <p className="text-[11px] text-zinc-400 mt-2">नकद + ऑनलाइन</p>
                  </div>
                  <div onClick={() => { setActiveTab('payments'); setPaymentFilter('Pending'); }} className="bg-zinc-950 border border-orange-500/30 p-4 rounded-2xl cursor-pointer">
                    <p className="text-zinc-400 text-xs font-bold">कुल बकाया (Pending Due)</p>
                    <p className="text-2xl sm:text-3xl font-black text-orange-400 mt-1">₹{totalPending.toLocaleString()}</p>
                    <p className="text-[11px] text-orange-300 mt-2 underline">बकाया लिस्ट देखें →</p>
                  </div>
                  <div className="bg-zinc-950 border border-zinc-800 p-4 rounded-2xl">
                    <p className="text-zinc-400 text-xs font-bold">पेमेंट मोड (Cash / UPI)</p>
                    <p className="text-xs sm:text-sm font-bold text-emerald-400 mt-2">💵 Cash: ₹{cashTotal.toLocaleString()}</p>
                    <p className="text-xs sm:text-sm font-bold text-blue-400 mt-1">📱 UPI: ₹{onlineTotal.toLocaleString()}</p>
                  </div>
                </div>
              </>
            )}

            {/* Search & Filter Controls */}
            <div className="bg-zinc-950 border border-zinc-800 p-3.5 rounded-2xl flex flex-col sm:flex-row gap-3 justify-between items-center">
              <input 
                type="text"
                placeholder="🔍 नाम या मोबाइल नंबर से मेंबर खोजें..."
                value={searchTerm}
                onChange={e => setSearchTerm(e.target.value)}
                className="w-full sm:w-96 bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500"
              />
              {activeTab === 'payments' && (
                <div className="flex gap-1.5 w-full sm:w-auto">
                  {['All', 'Pending', 'Paid'].map(f => (
                    <button
                      key={f}
                      onClick={() => setPaymentFilter(f)}
                      className={`flex-1 sm:flex-initial px-3 py-2 rounded-lg text-xs font-bold ${
                        paymentFilter === f ? 'bg-red-600 text-white' : 'bg-zinc-900 text-zinc-400'
                      }`}
                    >
                      {f === 'All' ? 'सभी' : f === 'Pending' ? 'बाकी (Due)' : 'जमा (Paid)'}
                    </button>
                  ))}
                </div>
              )}
            </div>

            {/* Members / Payments List */}
            <div className="bg-zinc-950 border border-zinc-800 rounded-2xl overflow-hidden shadow-xl">
              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse min-w-[820px]">
                  <thead>
                    <tr className="bg-zinc-900/80 text-zinc-400 text-xs uppercase border-b border-zinc-800">
                      <th className="p-3.5 font-bold">कैंडिडेट (Member)</th>
                      <th className="p-3.5 font-bold">प्लान और वैधता</th>
                      <th className="p-3.5 font-bold">तय फीस</th>
                      <th className="p-3.5 font-bold">जमा (Paid)</th>
                      <th className="p-3.5 font-bold">बाकी (Due)</th>
                      <th className="p-3.5 font-bold text-right">रसीद / WhatsApp / किश्त</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-zinc-800/60 text-sm">
                    {filteredMembers
                      .filter(m => {
                        if (activeTab !== 'payments' || paymentFilter === 'All') return true;
                        const fin = getMemberFinancials(m);
                        return paymentFilter === 'Pending' ? fin.pendingAmount > 0 : fin.pendingAmount === 0;
                      })
                      .map(member => {
                        const fin = getMemberFinancials(member);
                        const expiry = new Date(member.joinDate);
                        expiry.setMonth(expiry.getMonth() + parseInt(member.planDuration || 1));
                        return (
                          <tr key={member.id} className="hover:bg-zinc-900/40">
                            <td className="p-3.5">
                              <div className="flex items-center gap-3">
                                <MemberAvatar 
                                  member={member} 
                                  onClick={() => member.photo && setPreviewPhoto({ url: member.photo, name: member.name, phone: member.phone })}
                                />
                                <div>
                                  <p className="font-bold text-white">{member.name}</p>
                                  <p className="text-xs text-zinc-400">📞 {member.phone}</p>
                                </div>
                              </div>
                            </td>
                            <td className="p-3.5">
                              <span className="bg-zinc-800 text-zinc-200 text-xs font-bold px-2 py-0.5 rounded">{member.planDuration}M Plan</span>
                              <p className="text-xs text-zinc-400 mt-1">खत्म: {expiry.toLocaleDateString('en-IN')}</p>
                            </td>
                            <td className="p-3.5 font-bold text-white">₹{fin.totalAgreed.toLocaleString()}</td>
                            <td className="p-3.5 font-bold text-green-400">
                              ₹{fin.paidAmount.toLocaleString()}
                              <p className="text-[11px] text-zinc-500 font-normal">{fin.payments.length} किश्त</p>
                            </td>
                            <td className="p-3.5">
                              {fin.pendingAmount > 0 ? (
                                <span className="bg-orange-500/15 text-orange-400 border border-orange-500/30 px-2.5 py-1 rounded-lg text-xs font-black">
                                  ₹{fin.pendingAmount.toLocaleString()} बाकी
                                </span>
                              ) : (
                                <span className="bg-green-500/15 text-green-400 border border-green-500/30 px-2.5 py-1 rounded-lg text-xs font-bold">
                                  Clear
                                </span>
                              )}
                            </td>
                            <td className="p-3.5 text-right">
                              <div className="flex items-center justify-end gap-1.5">
                                <button
                                  onClick={() => setSelectedMemberForPayment(member)}
                                  className="bg-zinc-800 hover:bg-red-600 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold transition-colors"
                                >
                                  💰 किश्त/हिसाब
                                </button>
                                <button
                                  onClick={() => setReceiptMember(member)}
                                  className="bg-blue-600/20 hover:bg-blue-600 text-blue-300 hover:text-white border border-blue-500/30 px-2.5 py-1.5 rounded-lg text-xs font-bold transition-colors"
                                  title="रसीद देखें और WhatsApp पर भेजें"
                                >
                                  🧾 रसीद
                                </button>
                                {fin.pendingAmount > 0 && (
                                  <button
                                    onClick={() => sendWhatsAppDueAlert(member)}
                                    className="bg-green-600/20 hover:bg-green-600 text-green-300 hover:text-white border border-green-500/30 px-2.5 py-1.5 rounded-lg text-xs font-bold transition-colors"
                                    title="WhatsApp पर बकाया फीस का अलर्ट भेजें"
                                  >
                                    📲 बकाया अलर्ट
                                  </button>
                                )}
                                <button
                                  onClick={() => setConfirmDialog({
                                    title: "मेंबर हटाएं?",
                                    message: `क्या आप ${member.name} का रिकॉर्ड हटाना चाहते हैं?`,
                                    onConfirm: () => {
                                      setMembers(prev => prev.filter(m => m.id !== member.id));
                                      showToast("रिकॉर्ड हटा दिया गया।");
                                    }
                                  })}
                                  className="text-zinc-500 hover:text-red-500 px-2 py-1.5"
                                >
                                  🗑️
                                </button>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    {filteredMembers.length === 0 && (
                      <tr>
                        <td colSpan="6" className="p-12 text-center text-zinc-500">कोई रिकॉर्ड नहीं मिला। ऊपर "+ नया एडमिशन" पर क्लिक करें।</td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {/* Add Member Modal */}
          {isAddModalOpen && (
            <AddMemberModal 
              onClose={() => setIsAddModalOpen(false)}
              onSave={(newMember) => {
                setMembers(prev => [newMember, ...prev]);
                showToast(`${newMember.name} का एडमिशन सेव हो गया!`);
                setIsAddModalOpen(false);
              }}
              showToast={showToast}
            />
          )}

          {/* Installment Modal */}
          {selectedMemberForPayment && (
            <InstallmentModal 
              member={members.find(m => m.id === selectedMemberForPayment.id) || selectedMemberForPayment}
              onClose={() => setSelectedMemberForPayment(null)}
              onUpdateMember={(updated) => {
                setMembers(prev => prev.map(m => m.id === updated.id ? updated : m));
                setSelectedMemberForPayment(updated);
              }}
              onOpenReceipt={(m) => {
                setSelectedMemberForPayment(null);
                setReceiptMember(m);
              }}
              showToast={showToast}
            />
          )}

          {/* Receipt Modal */}
          {receiptMember && (
            <ReceiptModal 
              member={receiptMember}
              onClose={() => setReceiptMember(null)}
            />
          )}

          {/* Photo Preview */}
          {previewPhoto && (
            <div className="fixed inset-0 z-[190] bg-black/90 flex items-center justify-center p-4" onClick={() => setPreviewPhoto(null)}>
              <div className="bg-zinc-900 border border-zinc-700 rounded-3xl p-3 max-w-sm w-full text-center" onClick={e => e.stopPropagation()}>
                <img src={previewPhoto.url} alt={previewPhoto.name} className="w-full max-h-[70vh] object-contain rounded-2xl" />
                <p className="font-bold text-white mt-2">{previewPhoto.name}</p>
                <button onClick={() => setPreviewPhoto(null)} className="mt-2 bg-red-600 text-white px-4 py-1.5 rounded-xl text-xs font-bold">बंद करें</button>
              </div>
            </div>
          )}

          {/* Confirm Dialog */}
          {confirmDialog && (
            <div className="fixed inset-0 z-[195] bg-black/80 flex items-center justify-center p-4">
              <div className="bg-zinc-950 border border-zinc-800 rounded-2xl p-6 max-w-sm w-full">
                <h3 className="text-lg font-bold text-white">{confirmDialog.title}</h3>
                <p className="text-zinc-400 text-sm mt-1">{confirmDialog.message}</p>
                <div className="flex justify-end gap-2 mt-5">
                  <button onClick={() => setConfirmDialog(null)} className="px-4 py-2 rounded-lg bg-zinc-800 text-zinc-300 text-xs font-bold">रद्द करें</button>
                  <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog(null); }} className="px-4 py-2 rounded-lg bg-red-600 text-white text-xs font-bold">हाँ, हटाएं</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function AddMemberModal({ onClose, onSave, showToast }) {
      const [photoPreview, setPhotoPreview] = useState('');
      const camRef = useRef(null);
      const galRef = useRef(null);
      const [formData, setFormData] = useState({
        name: '',
        phone: '',
        planDuration: '1',
        joinDate: new Date().toISOString().split('T')[0],
        totalFee: '',
        initialPaid: '',
        paymentMode: 'Cash'
      });

      const handlePhoto = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const base64 = await compressImage(file);
          setPhotoPreview(base64);
        } catch (err) {
          showToast("फोटो लोड करने में समस्या आई।", "error");
        }
      };

      const agreed = Number(formData.totalFee) || 0;
      const paid = Number(formData.initialPaid) || 0;
      const pending = Math.max(0, agreed - paid);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (paid > agreed) {
          showToast("जमा फीस कुल तय फीस से ज्यादा नहीं हो सकती!", "error");
          return;
        }
        const payments = paid > 0 ? [{
          id: Date.now().toString(),
          amount: paid,
          date: formData.joinDate,
          mode: formData.paymentMode,
          note: 'एडमिशन के समय जमा'
        }] : [];

        onSave({
          id: 'jf_' + Date.now(),
          name: formData.name.trim(),
          phone: formData.phone.trim(),
          planDuration: formData.planDuration,
          joinDate: formData.joinDate,
          photo: photoPreview || null,
          totalFee: agreed,
          paidAmount: paid,
          pendingAmount: pending,
          feeStatus: pending === 0 && agreed > 0 ? 'Paid' : 'Pending',
          paymentMode: formData.paymentMode,
          payments,
          createdAt: new Date().toISOString()
        });
      };

      return (
        <div className="fixed inset-0 z-[150] bg-black/85 flex items-center justify-center p-3 overflow-y-auto">
          <div className="bg-zinc-950 border border-zinc-800 rounded-3xl max-w-lg w-full p-5 space-y-4 my-auto">
            <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
              <h3 className="text-xl font-black text-white">नया एडमिशन (New Member)</h3>
              <button onClick={onClose} className="text-zinc-400 hover:text-white text-lg font-bold">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="bg-zinc-900/60 border border-zinc-800 p-3 rounded-2xl flex items-center gap-4">
                {photoPreview ? (
                  <img src={photoPreview} className="w-20 h-20 rounded-2xl object-cover border-2 border-red-500" />
                ) : (
                  <div className="w-20 h-20 rounded-2xl bg-zinc-950 border border-dashed border-zinc-700 flex items-center justify-center text-xs text-zinc-500">No Photo</div>
                )}
                <div className="space-y-2">
                  <p className="text-xs font-bold text-zinc-300">कैंडिडेट की फोटो</p>
                  <input ref={camRef} type="file" accept="image/*" capture="environment" onChange={handlePhoto} className="hidden" />
                  <input ref={galRef} type="file" accept="image/*" onChange={handlePhoto} className="hidden" />
                  <div className="flex gap-2">
                    <button type="button" onClick={() => camRef.current?.click()} className="bg-red-600/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-xl text-xs font-bold">📷 कैमरा</button>
                    <button type="button" onClick={() => galRef.current?.click()} className="bg-zinc-800 text-zinc-200 px-3 py-1.5 rounded-xl text-xs font-bold">🖼️ गैलरी</button>
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div className="sm:col-span-2">
                  <label className="text-xs font-bold text-zinc-400">पूरा नाम *</label>
                  <input type="text" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full mt-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-white" placeholder="राहुल शर्मा" />
                </div>
                <div>
                  <label className="text-xs font-bold text-zinc-400">मोबाइल नंबर (WhatsApp) *</label>
                  <input type="tel" required maxLength="10" value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value.replace(/\D/g, '')})} className="w-full mt-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-white" placeholder="10 अंकों का नंबर" />
                </div>
                <div>
                  <label className="text-xs font-bold text-zinc-400">ज्वाइनिंग तारीख *</label>
                  <input type="date" required value={formData.joinDate} onChange={e => setFormData({...formData, joinDate: e.target.value})} className="w-full mt-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-white [color-scheme:dark]" />
                </div>
                <div>
                  <label className="text-xs font-bold text-zinc-400">प्लान (महीने) *</label>
                  <select value={formData.planDuration} onChange={e => setFormData({...formData, planDuration: e.target.value})} className="w-full mt-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-white">
                    <option value="1">1 महीना</option>
                    <option value="2">2 महीने</option>
                    <option value="3">3 महीने</option>
                    <option value="6">6 महीने</option>
                    <option value="12">12 महीने (1 साल)</option>
                  </select>
                </div>
                <div>
                  <label className="text-xs font-bold text-zinc-400">तय फीस (Total Agreed ₹) *</label>
                  <input type="number" required min="0" value={formData.totalFee} onChange={e => setFormData({...formData, totalFee: e.target.value, initialPaid: formData.initialPaid === formData.totalFee ? e.target.value : formData.initialPaid})} className="w-full mt-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-white font-bold" placeholder="1500" />
                </div>
                <div>
                  <label className="text-xs font-bold text-green-400">आज जमा (Paid Now ₹)</label>
                  <input type="number" min="0" max={agreed} value={formData.initialPaid} onChange={e => setFormData({...formData, initialPaid: e.target.value})} className="w-full mt-1 bg-zinc-900 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-green-400 font-bold" placeholder="0" />
                </div>
                <div>
                  <label className="text-xs font-bold text-zinc-400">पेमेंट मोड</label>
                  <div className="grid grid-cols-2 gap-2 mt-1">
                    <button type="button" onClick={() => setFormData({...formData, paymentMode: 'Cash'})} className={`py-2.5 rounded-xl text-xs font-bold border ${formData.paymentMode === 'Cash' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-zinc-900 border-zinc-800 text-zinc-400'}`}>💵 Cash</button>
                    <button type="button" onClick={() => setFormData({...formData, paymentMode: 'Online'})} className={`py-2.5 rounded-xl text-xs font-bold border ${formData.paymentMode === 'Online' ? 'bg-blue-500/20 border-blue-500 text-blue-300' : 'bg-zinc-900 border-zinc-800 text-zinc-400'}`}>📱 UPI</button>
                  </div>
                </div>
              </div>

              <div className="flex justify-between items-center bg-zinc-900 px-4 py-2.5 rounded-xl text-xs">
                <span className="text-zinc-400">बाकी बकाया (Pending Balance):</span>
                <strong className="text-orange-400 text-sm">₹{pending.toLocaleString()}</strong>
              </div>

              <div className="flex justify-end gap-2 pt-2">
                <button type="button" onClick={onClose} className="px-4 py-2.5 rounded-xl bg-zinc-800 text-zinc-300 text-xs font-bold">रद्द करें</button>
                <button type="submit" className="px-6 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-bold shadow-lg">सेव करें</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function InstallmentModal({ member, onClose, onUpdateMember, onOpenReceipt, showToast }) {
      const fin = getMemberFinancials(member);
      const [amount, setAmount] = useState(fin.pendingAmount > 0 ? String(fin.pendingAmount) : '');
      const [mode, setMode] = useState('Cash');
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [note, setNote] = useState('');

      const handleAdd = (e) => {
        e.preventDefault();
        const val = Number(amount);
        if (!val || val <= 0) return;
        const newPay = { id: Date.now().toString(), amount: val, date, mode, note: note.trim() || 'किश्त जमा' };
        const updatedPayments = [...fin.payments, newPay];
        const newPaid = updatedPayments.reduce((s, p) => s + (Number(p.amount) || 0), 0);
        const newPending = Math.max(0, fin.totalAgreed - newPaid);

        onUpdateMember({
          ...member,
          payments: updatedPayments,
          paidAmount: newPaid,
          pendingAmount: newPending,
          feeStatus: newPending === 0 ? 'Paid' : 'Pending'
        });
        showToast(`₹${val} किश्त जोड़ दी गई!`);
        setAmount('');
        setNote('');
      };

      return (
        <div className="fixed inset-0 z-[160] bg-black/85 flex items-center justify-center p-3 overflow-y-auto">
          <div className="bg-zinc-950 border border-zinc-800 rounded-3xl max-w-xl w-full p-5 space-y-5 my-auto max-h-[92vh] overflow-y-auto">
            <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
              <div>
                <h3 className="text-xl font-black text-white">{member.name} - फीस खाता</h3>
                <p className="text-xs text-zinc-400">📞 {member.phone} • {member.planDuration}M Plan</p>
              </div>
              <button onClick={onClose} className="text-zinc-400 hover:text-white text-lg font-bold">✕</button>
            </div>

            <div className="grid grid-cols-3 gap-2.5 text-center">
              <div className="bg-zinc-900 p-3 rounded-2xl border border-zinc-800">
                <p className="text-[10px] text-zinc-400 uppercase font-bold">तय फीस</p>
                <p className="text-lg font-black text-white">₹{fin.totalAgreed.toLocaleString()}</p>
              </div>
              <div className="bg-green-950/30 p-3 rounded-2xl border border-green-800/40">
                <p className="text-[10px] text-green-400 uppercase font-bold">कुल जमा</p>
                <p className="text-lg font-black text-green-400">₹{fin.paidAmount.toLocaleString()}</p>
              </div>
              <div className="bg-orange-950/30 p-3 rounded-2xl border border-orange-800/40">
                <p className="text-[10px] text-orange-400 uppercase font-bold">बाकी (Due)</p>
                <p className="text-lg font-black text-orange-400">₹{fin.pendingAmount.toLocaleString()}</p>
              </div>
            </div>

            {/* Quick WhatsApp & Receipt Actions */}
            <div className="flex flex-wrap gap-2">
              <button type="button" onClick={() => onOpenReceipt(member)} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2.5 px-3 rounded-xl text-xs font-bold text-center">
                🧾 पक्की रसीद बनाएं / WhatsApp भेजें
              </button>
              {fin.pendingAmount > 0 && (
                <button type="button" onClick={() => sendWhatsAppDueAlert(member)} className="flex-1 bg-green-600 hover:bg-green-500 text-white py-2.5 px-3 rounded-xl text-xs font-bold text-center">
                  📲 बकाया फीस WhatsApp रिमाइंडर
                </button>
              )}
            </div>

            <form onSubmit={handleAdd} className="bg-zinc-900/60 border border-zinc-800 p-4 rounded-2xl space-y-3">
              <p className="text-xs font-bold text-red-400 uppercase">+ नई किश्त जमा करें</p>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                <input type="number" required min="1" value={amount} onChange={e => setAmount(e.target.value)} placeholder="₹ राशि" className="bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-white font-bold text-sm" />
                <input type="date" required value={date} onChange={e => setDate(e.target.value)} className="bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm [color-scheme:dark]" />
                <div className="grid grid-cols-2 gap-1">
                  <button type="button" onClick={() => setMode('Cash')} className={`rounded-xl text-xs font-bold border ${mode === 'Cash' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-zinc-950 border-zinc-800 text-zinc-400'}`}>💵 Cash</button>
                  <button type="button" onClick={() => setMode('Online')} className={`rounded-xl text-xs font-bold border ${mode === 'Online' ? 'bg-blue-500/20 border-blue-500 text-blue-300' : 'bg-zinc-950 border-zinc-800 text-zinc-400'}`}>📱 UPI</button>
                </div>
              </div>
              <div className="flex gap-2">
                <input type="text" value={note} onChange={e => setNote(e.target.value)} placeholder="नोट (जैसे: दूसरी किश्त)" className="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white" />
                <button type="submit" className="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-xl text-xs font-bold">+ जमा करें</button>
              </div>
            </form>

            <div className="space-y-2">
              <p className="text-xs font-bold text-zinc-400 uppercase">पेमेंट हिस्ट्री ({fin.payments.length})</p>
              {fin.payments.map((p, i) => (
                <div key={p.id || i} className="bg-zinc-900 border border-zinc-800 px-3.5 py-2.5 rounded-xl flex justify-between items-center text-xs">
                  <div>
                    <span className="font-black text-green-400 text-sm">₹{Number(p.amount).toLocaleString()}</span>
                    <span className="ml-2 px-2 py-0.5 rounded bg-zinc-800 text-zinc-300 font-bold">{p.mode}</span>
                    <p className="text-zinc-400 mt-0.5">{new Date(p.date).toLocaleDateString('en-IN')} • {p.note}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function ReceiptModal({ member, onClose }) {
      const fin = getMemberFinancials(member);
      const expiry = new Date(member.joinDate);
      expiry.setMonth(expiry.getMonth() + parseInt(member.planDuration || 1));

      return (
        <div className="fixed inset-0 z-[180] bg-black/90 flex items-center justify-center p-3 overflow-y-auto">
